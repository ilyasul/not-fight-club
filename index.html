<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Not Fight Club</title>
</head>
<body>
<div class="screen-win-loose">
    <div class="pop-up"></div>
</div>
<div class="screen-set-avatar">
    <div class="container-avatar-pick">
        <img class="avatar-pick" src="assets/avatar/user1.svg">
        <img class="avatar-pick" src="assets/avatar/user2.svg">
        <img class="avatar-pick" src="assets/avatar/user3.svg">
        <img class="avatar-pick" src="assets/avatar/user4.svg">
    </div>
</div>
<div class="container-body">
    <header class="header">
        <h1>BF</h1>
        <div class="container-header-btn">
            <span class="icon settings" onclick="displayPageSettings()"></span>
            <span class="icon home" onclick="displayPageHome()"></span>
            <span class="icon profile" onclick="displayPageProfile()"></span>
        </div>
    </header>    
    <section class="registration-page">
        <h2>Hello warrior!</h2>
        <div>What is your name?</div>
        <input id="user-name" type="text" placeholder="User-Name">
        <input type="button" id="btn-go" onclick="getUserName()" value="Go!!!">
    </section>
    <section class="home-page">
        <div class="container-main">
            <form class="input-fight">
                <input type="button" value="Fight!" onclick="pageFight()" class="btn-fight">
            </form>
        </div>
    </section>
    <section class="profile-page">
        <div class="user-name-value"></div>
        <div class="avatar container">
            <img src="assets/avatar/user1.svg" class="avatar user" height="200px">
            <span class="avatar-set" onclick="setAvatar()"></span>
        </div>
        <div class="score">
            <span class="wins"></span>
            <span class="loose"></span>
        </div>
    </section>
    <section class="settings-page">
        <div class="rename">Set name user<br>
            <input id="user-name-set" type="text" placeholder="User-Name">
            <input type="button" onclick="setUserName()" value="Set">
        </div>
    </section>
    <section class="battle-page">
        <div class="container-battle">
            <div class="user-warrior">
                <div class="user-name-value"></div>
                <img src="assets/avatar/user1.svg" height="200px" alt="avatar user" class="avatar user">
                <div class="health-user">150</div>
            </div>
            <div class="container-list">
                <div class="attack-list-user">
                    <div>Attack zone<br>(pick one zone)</div>
                    <div>
                        <label for="head">Head</label>
                        <input type="radio" id="head" name="attack-user" value="head">
                    </div>
                    <div>
                        <label for="neck">Neck</label>
                        <input type="radio" id="neck" name="attack-user" value="neck">
                    </div>
                    <div>
                        <label for="body">Body</label>
                        <input type="radio" id="body" name="attack-user" value="body">
                    </div>
                    <div>
                        <label for="belly">Belly</label>
                        <input type="radio" id="belly" name="attack-user" value="belly">
                    </div>
                    <div>
                        <label for="legs">Legs</label>
                        <input type="radio" id="legs" name="attack-user" value="legs">
                    </div>
                </div>
                <div class="block-list-user">
                    <div>Block zone<br>(pick two zone)</div>
                    <div>
                        <input type="checkbox" class="block-zone" onclick="activeBtnBattle()" value="0">
                        <label for="head">Head</label>
                    </div>
                    <div>
                        <input type="checkbox" class="block-zone" onclick="activeBtnBattle()" value="1">
                        <label for="neck">Neck</label>
                    </div>
                    <div>
                        <input type="checkbox" class="block-zone" onclick="activeBtnBattle()" value="2">
                        <label for="body">Body</label>
                    </div>
                    <div>
                        <input type="checkbox" class="block-zone" onclick="activeBtnBattle()" value="3">
                        <label for="belly">Belly</label>
                    </div>
                    <div>
                        <input type="checkbox" class="block-zone" onclick="activeBtnBattle()" value="4">
                        <label for="legs">Legs</label>
                    </div>
                </div>
            </div>
            <div class="monster-warrior">
                    <div class="monster-name">Monster</div>
                    <img src="assets/avatar/monster.svg" alt="avatar monster" height="200px" class="avatar monster">
                    <div class="health-monster">110</div>
            </div>
        </div>
        <input type="button" name="battle" class="battle" value="battle" disabled>
        <div class="window-log"></div>
    </section> 
</div>
    <script src="script.js"></script>
</body>
</html>
